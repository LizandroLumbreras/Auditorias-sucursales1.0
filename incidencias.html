<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Incidencias del Personal</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

:root{
    --azul1:#00416A;
    --azul2:#0c6cbd;
    --blanco:#ffffff;
}

/* FONDO */
body{
   margin:0;
   font-family:'Poppins', sans-serif;
   min-height:100vh;
   background: linear-gradient(135deg, var(--azul1), var(--azul2));
   padding-top:40px;
   position:relative;
   overflow-x:hidden;
}

/* ✔ MARCA DE AGUA */
.watermark{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:650px;
    opacity:0.10;
    pointer-events:none;
    z-index:0;
}

/* TARJETA */
.card{
   background:rgba(255,255,255,0.18);
   backdrop-filter:blur(14px);
   padding:30px;
   border-radius:18px;
   max-width:600px;
   margin:auto;
   color:white;
   box-shadow:0 8px 35px rgba(0,0,0,.25);
   position:relative;
   z-index:5;
   animation: fadeUp .7s ease;
}

@keyframes fadeUp{
    from{ opacity:0; transform:translateY(25px); }
    to{ opacity:1; transform:translateY(0); }
}

/* TÍTULO */
h2{
   text-align:center;
   color:white;
   margin-bottom:20px;
   font-size:30px;
   font-weight:600;
}

/* TEXTAREA */
textarea{
   width:96%;
   padding:14px;
   border-radius:12px;
   border:none;
   outline:none;
   resize:none;
   height:170px;
   font-size:16px;
   background:rgba(255,255,255,0.90);
   box-shadow:inset 0 2px 6px rgba(0,0,0,.15);
   color:#333;
   margin-top:15px;
}

/* BOTÓN */
button{
   width:100%;
   padding:16px;
   border:none;
   border-radius:12px;
   margin-top:25px;
   font-size:18px;
   font-weight:600;
   cursor:pointer;
   transition:0.25s ease;
   box-shadow:0 5px 12px rgba(0,0,0,.25);
}

/* DESACTIVADO */
.disabled{
   background:#9bb6c8;
   color:white;
   pointer-events:none;
}

/* ACTIVADO */
.enabled{
   background:white;
   color:var(--azul1);
}
.enabled:hover{
    background:#ececec;
    transform:translateY(-2px);
}
</style>
</head>

<body>

<!-- ✔ MARCA DE AGUA -->
<img src="logo_proveedora.webp" class="watermark">

<h2>Incidencias de Personal</h2>

<div class="card">
    <p style="font-size:17px;">
        Escribe cualquier incidencia que haya ocurrido hoy (faltas, retardos, problemas, desempeño, etc.).
    </p>

<textarea id="incidencias" placeholder="Escribe aquí..."></textarea>

<!-- NUEVA PREGUNTA -->
<div style="margin-top:25px;">
    <p style="font-size:17px;">
        ¿Necesitas algún equipo de oficina (teclado, mouse, pantalla, etc)?
        Menciona qué falla presenta:
    </p>

    <textarea id="equipoOficina" 
        placeholder="Ejemplo:
Mouse no funciona
Pantalla parpadea
Teclado con teclas dañadas"></textarea>
</div>
<!-- FOTO SOLO MÓVIL -->
<div id="bloqueFoto" style="margin-top:20px; display:none;">
    <p style="font-size:17px;">
        Adjuntar evidencia fotográfica (opcional):
    </p>

<input type="file" id="fotoIncidencia" accept="image/*" multiple>

<div id="previewFotos" style="
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap:12px;
    margin-top:15px;
"></div>

<button id="btnContinuar" class="disabled">Continuar</button>
</div>

<script>
const textarea = document.getElementById("incidencias");
const btn = document.getElementById("btnContinuar");
// Mostrar botón foto solo en móvil
document.getElementById("bloqueFoto").style.display = "block";
async function convertirBase64(file){
    return new Promise((resolve)=>{

        const img = new Image();
        const reader = new FileReader();

        reader.onload = e=>{
            img.src = e.target.result;
        };

        img.onload = ()=>{

            const canvas = document.createElement("canvas");

            const MAX_WIDTH = 800;   // reduce tamaño
            const scale = MAX_WIDTH / img.width;

            canvas.width = MAX_WIDTH;
            canvas.height = img.height * scale;

            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

            // compresión fuerte (0.6 = 60% calidad)
            resolve(canvas.toDataURL("image/jpeg", 0.6));
        };

        reader.readAsDataURL(file);
    });
}
const inputFotoPreview = document.getElementById("fotoIncidencia");
const preview = document.getElementById("previewFotos");

let archivosSeleccionados = [];

if(inputFotoPreview){

    inputFotoPreview.addEventListener("change", ()=>{

        const nuevosArchivos = Array.from(inputFotoPreview.files);

        if(archivosSeleccionados.length + nuevosArchivos.length > 4){
            alert("Máximo 4 fotos.");
            inputFotoPreview.value = "";
            return;
        }

        nuevosArchivos.forEach(file=>{
            archivosSeleccionados.push(file);
        });

        inputFotoPreview.value = ""; // limpiar input
        renderPreview();
    });
}

function renderPreview(){

    preview.innerHTML = "";

    archivosSeleccionados.forEach((file, index)=>{

        const reader = new FileReader();

        reader.onload = e=>{

            const container = document.createElement("div");
            container.style.position = "relative";

            const img = document.createElement("img");
            img.src = e.target.result;
            img.style.width = "100%";
            img.style.height = "130px";
            img.style.objectFit = "cover";
            img.style.borderRadius = "12px";
            img.style.boxShadow = "0 4px 10px rgba(0,0,0,.3)";

            const btnEliminar = document.createElement("div");
            btnEliminar.innerHTML = "✕";
            btnEliminar.style.position = "absolute";
            btnEliminar.style.top = "6px";
            btnEliminar.style.right = "6px";
            btnEliminar.style.background = "rgba(0,0,0,.6)";
            btnEliminar.style.color = "white";
            btnEliminar.style.width = "24px";
            btnEliminar.style.height = "24px";
            btnEliminar.style.display = "flex";
            btnEliminar.style.alignItems = "center";
            btnEliminar.style.justifyContent = "center";
            btnEliminar.style.borderRadius = "50%";
            btnEliminar.style.cursor = "pointer";
            btnEliminar.style.fontSize = "14px";

            btnEliminar.onclick = ()=>{
                archivosSeleccionados.splice(index,1);
                renderPreview();
            };

            container.appendChild(img);
            container.appendChild(btnEliminar);
            preview.appendChild(container);
        };

        reader.readAsDataURL(file);
    });
}
/* ACTIVAR BOTÓN AUTOMÁTICAMENTE */
textarea.addEventListener("input", ()=>{
    const txt = textarea.value.trim();

    if(txt.length >= 5){
        btn.classList.remove("disabled");
        btn.classList.add("enabled");
    }else{
        btn.classList.add("disabled");
        btn.classList.remove("enabled");
    }
});

btn.addEventListener("click", async ()=>{
    const txt = textarea.value.trim();

    if(txt.length < 5){
        alert("Debes escribir al menos una incidencia.");
        return;
    }

    const equipo = document.getElementById("equipoOficina").value.trim();

    let fotos = [];

    for(let file of archivosSeleccionados){
        const base64 = await convertirBase64(file);
        fotos.push(base64);
    }

    localStorage.setItem("aud_incidencias", JSON.stringify({
        general: txt,
        equipo: equipo,
        fotos: fotos
    }));

    window.location = "sugerencias.html";
});
</script>

</body>
</html>
